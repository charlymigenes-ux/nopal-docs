name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: el core y los plugins cambian sin que este repositorio haga push.
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      # Fuentes: clones superficiales de solo lectura de los repos públicos del alcance.
      - run: npm run fetch
      # Páginas generadas (referencia REST, fichas y matriz de plugins).
      - run: npm run gen
      # Las páginas generadas versionadas deben estar al día con el código fuente.
      - name: Las páginas generadas están actualizadas
        run: git diff --exit-code -- docs i18n plugin-docs ':(exclude)docs/08-proyecto/changelog.md' ':(exclude)i18n/en/docusaurus-plugin-content-docs/current/08-proyecto/changelog.md'

      # Standard §18: validadores antes de compilar.
      - run: npm run check
      - run: npm run check:sources
      # onBrokenLinks: 'throw' hace fallar el build ante enlaces rotos.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
